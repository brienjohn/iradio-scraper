name: iradio daily finalize

on:
  workflow_dispatch:
  schedule:
    - cron: "5 16 * * *"  # UTC 16:05 = Asia/Taipei 00:05

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Scrape yesterday, backfilling any gap in the past 7 days
        run: |
          for dt in 1 2 3 4 5 6 7; do
            DATE=$(date -d "$dt days ago" +%F)
            FILE="data/iradio_${DATE}.csv"
            if [ -f "$FILE" ]; then
              continue
            fi
            echo "缺 ${DATE}，補抓..."
            python iradio_scrape.py --dt "$dt" --out "$FILE" --append-dedupe --insecure
          done

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "iradio daily + backfill $(date +%F)"
          git push
